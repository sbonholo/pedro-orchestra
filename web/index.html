<style>
*, *::before, *::after { box-sizing: border-box; }
/* Layout: full-bleed 3D stage; UI floats on it like programme cards under stage light. Single dark look (a concert hall at curtain-up). */
:root {
  color-scheme: dark;
  --ink: #0d0b10;          /* hall darkness */
  --card: rgba(22, 18, 24, 0.90);
  --card-solid: #19151b;
  --line: rgba(232, 200, 140, 0.16);
  --gold: #e2b86e;         /* brass and gilt */
  --gold-dim: #8c6a3a;
  --text: #f2ebe0;
  --muted: #b3a89a;
  --good: #8fcf9a;
  --bad: #e88b78;
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; min-height: 40px; transition: background .12s, border-color .12s; }
.btn:hover { background: rgba(255,255,255,0.11); }
.btn:disabled { opacity: .42; cursor: default; }
.btn.on { background: rgba(226,184,110,0.18); border-color: var(--gold-dim); color: #fff; }
.btn.primary { background: linear-gradient(#b98b47, #8f6630); border-color: #c79a55; color: #1a1206; font-weight: 600; }
.btn.primary:hover { background: linear-gradient(#c99a55, #9c7136); }
.ui { position: fixed; z-index: 5; }
#topbar > * { flex-shrink: 0; }
#topbar { top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: linear-gradient(rgba(10,8,12,.92), rgba(10,8,12,.55)); }
#brand { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: .06em; color: var(--gold); margin-right: 10px; white-space: nowrap; }
#brand small { font-family: var(--body); font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-left: 8px; text-transform: uppercase; }
.spacer { flex: 1; }
#bottombar { bottom: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgba(10,8,12,.4), rgba(10,8,12,.92)); }
#status { flex: 1; min-width: 180px; text-align: center; color: var(--muted); font-size: 13px; }
#status b { color: var(--gold); font-weight: 500; }
#progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: transparent; }
#progress i { display: block; height: 100%; width: 0; background: var(--gold); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  overflow-y: auto; overscroll-behavior: contain; }
#roster { left: max(12px, env(safe-area-inset-left, 0px)); top: var(--top, 76px); bottom: var(--bot, 76px); width: 300px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
#coach { left: max(12px, env(safe-area-inset-left, 0px)); bottom: var(--bot, 76px); width: min(300px, calc(100vw - 24px)); padding: 14px 16px; display: grid; gap: 8px;
  background: var(--card); border: 1px solid var(--gold-dim); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#coach p { font-size: 13px; }
#coach .btn { font-size: 15px; min-height: 46px; }
#side { right: max(12px, env(safe-area-inset-right, 0px)); top: var(--top, 76px); bottom: var(--bot, 76px); width: min(460px, calc(100vw - 24px)); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
h2 { font-family: var(--display); font-size: 30px; font-weight: 600; margin: 0; line-height: 1.05; text-wrap: balance; }
h3 { font-family: var(--display); font-size: 21px; font-weight: 600; margin: 6px 0 0; }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { text-align: left; width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 3px; }
.card:hover { background: rgba(255,255,255,0.08); }
.card.on { border-color: var(--gold-dim); background: rgba(226,184,110,0.12); }
.card .t { font-weight: 600; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.skill { display: grid; grid-template-columns: 150px 1fr 46px; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.skill:hover { background: rgba(255,255,255,0.05); }

.bar i { display: block; height: 100%; border-radius: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tier { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; letter-spacing: .06em; border: 1px solid var(--gold-dim); color: var(--gold); }
#achv { right: max(16px, env(safe-area-inset-right, 0px)); top: var(--top, 76px); width: min(320px, calc(100vw - 32px)); padding: 14px 16px; display: grid; gap: 4px; z-index: 31; pointer-events: none;
  background: linear-gradient(135deg, #2a2116, #19151b); border: 1px solid var(--gold); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  opacity: 0; transform: translateY(-12px); transition: opacity .35s, transform .35s; }
#achv.show { opacity: 1; transform: none; }
@keyframes starPop { 0% { transform: rotate(45deg) scale(.2); opacity: 0; } 70% { transform: rotate(45deg) scale(1.25); opacity: 1; } 100% { transform: rotate(45deg) scale(1); } }
.stars .star.on { animation: starPop .45s ease-out both; }
.stars .star.on:nth-child(2) { animation-delay: .25s; } .stars .star.on:nth-child(3) { animation-delay: .5s; } .stars .star.on:nth-child(4) { animation-delay: .75s; } .stars .star.on:nth-child(5) { animation-delay: 1s; }
input[type=range] { width: 100%; accent-color: var(--gold); }
#toast { left: 50%; top: 84px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px)); padding: 12px 16px; white-space: pre-line; font-size: 13px;
  background: var(--card-solid); border: 1px solid var(--line); border-radius: 8px; transition: opacity .3s; pointer-events: none; z-index: 30; }
.modal-bg { position: fixed; inset: 0; z-index: 20; background: rgba(5,4,6,.62); display: grid; place-items: center;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { width: min(640px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 24px; display: grid; gap: 14px; background: var(--card-solid); border: 1px solid var(--line); border-radius: 12px; }
#menu { position: fixed; inset: 0; z-index: 15; display: flex; align-items: stretch; pointer-events: none; }
#menu .col { pointer-events: auto; width: min(440px, 100%); background: linear-gradient(90deg, rgba(8,6,10,.94), rgba(8,6,10,.72) 75%, rgba(8,6,10,0));
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
  padding-block: 32px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: 48px; }
#menu h1 { font-family: var(--display); font-weight: 700; font-size: clamp(46px, 7vw, 72px); line-height: .92; letter-spacing: .04em; margin: 0 0 6px; color: var(--gold); }
#menu .tag { color: var(--muted); margin-bottom: 14px; max-width: 30ch; }
#menu .btn { text-align: left; font-size: 15px; }
#menu .note { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.5; max-width: 34ch; }
.beats { display: flex; justify-content: center; gap: 18px; padding: 6px 0; }
.beat { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 30px; font-weight: 700;
  background: #2a2430; border: 2px solid transparent; transition: transform .05s; }
.beat.tap { border-color: var(--gold-dim); }
.pad { height: 150px; border-radius: 12px; border: 1px solid var(--gold-dim); background: rgba(226,184,110,0.10); font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: .1em; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pad small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: 0; color: var(--muted); font-weight: 400; }
#fb { text-align: center; font-family: var(--mono); font-size: 22px; min-height: 30px; }
.stars { display: flex; gap: 8px; align-items: center; }
.star { width: 22px; height: 22px; transform: rotate(45deg); border-radius: 4px; background: #3a3238; }
.star.on { background: var(--gold); }
.tut-step { display: grid; gap: 6px; }
.tut-step ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
.tut-dots { display: flex; gap: 6px; justify-content: center; }
.tut-dots i { width: 8px; height: 8px; border-radius: 50%; background: #3a3238; }
.tut-dots i.on { background: var(--gold); }
.score { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1; }
#loading { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--ink); color: var(--muted); font-family: var(--display); font-size: 22px; letter-spacing: .08em; }
@media (max-width: 1180px) { #brand { display: none; } }
@media (max-width: 760px) {
  #roster { width: auto; right: max(12px, env(safe-area-inset-right, 0px)); }
  #side { width: auto; left: max(12px, env(safe-area-inset-left, 0px)); }
  #brand small { display: none; }
  .skill { grid-template-columns: 112px 1fr 40px; }
  .btn { padding: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =====================================================================
   DATA — skills, tiers, instruments (same values as the Unity project)
   ===================================================================== */
const SKILLS = [
  ["Technique", "Technique", "Cleaner note starts, harder pieces, steadier bowing.", 1.2, [1, 8]],
  ["Speed", "Speed", "Maximum tempo before the musician slows the ensemble down.", 0.8, [0, 6]],
  ["Intonation", "Intonation", "How close each note is to the correct pitch (in cents).", 1.1, [3, 8]],
  ["Tone Quality", "Tone", "Less bow noise and scratch, warmer and brighter sound.", 1.0, [2, 5]],
  ["Musicality", "Musicality", "Phrase shaping: notes grow and relax with the melody.", 1.1, [5, 10]],
  ["Emotional Expression", "Expression", "Vibrato depth and emotional colour on long notes.", 0.9, [4, 3]],
  ["Rhythm", "Rhythm", "How precisely each note lands on the beat.", 1.0, [9, 8]],
  ["Sight-reading", "Sight-reading", "Accuracy on pieces the orchestra has not rehearsed yet.", 0.6, [8, 6]],
  ["Accuracy", "Accuracy", "Fewer wrong notes.", 1.0, [0, 2]],
  ["Ensemble Playing", "Ensemble", "Stays together with the others instead of drifting.", 0.9, [6, 10]],
  ["Performance Confidence", "Confidence", "Fewer nerves (and mistakes) in auditions and concerts.", 0.6, [4, 5]],
];
const S = { technique: 0, speed: 1, intonation: 2, tone: 3, musicality: 4, expression: 5, rhythm: 6, sight: 7, accuracy: 8, ensemble: 9, confidence: 10 };
const TIERS = [[0, "Novice"], [20, "Student"], [35, "Intermediate"], [50, "Advanced"], [65, "Professional"], [80, "World-Class"], [92, "Master"]];
const tierName = v => { let n = TIERS[0][1]; for (const [t, name] of TIERS) if (v >= t) n = name; return n; };
const nextTier = v => { for (const [t] of TIERS) if (v < t) return t; return 100; };

const INST = {
  violin: { name: "Violin", title: "Violinist", posture: "shoulder", order: 0, lo: 55, hi: 100, center: 74, oct: 0, L: .356, W: .205, D: .06, neck: .235, endpin: 0, bow: .75, bmin: .10, bmax: .62, loud: .95, set: "Violin" },
  viola: { name: "Viola", title: "Violist", posture: "shoulder", order: 1, lo: 48, hi: 88, center: 64, oct: -1, L: .41, W: .24, D: .065, neck: .26, endpin: 0, bow: .74, bmin: .10, bmax: .60, loud: 1.0, set: "Viola" },
  cello: { name: "Cello", title: "Cellist", posture: "knees", order: 2, lo: 36, hi: 81, center: 52, oct: -2, L: .76, W: .44, D: .22, neck: .48, endpin: .30, bow: .73, bmin: .10, bmax: .58, loud: 1.0, set: "Cello" },
  bass: { name: "Double Bass", title: "Double Bassist", posture: "standing", order: 3, lo: 28, hi: 67, center: 40, oct: -3, L: 1.11, W: .66, D: .30, neck: .70, endpin: .25, bow: .70, bmin: .08, bmax: .45, loud: 1.15, set: "DoubleBass" },
};
const INST_KEYS = Object.keys(INST);

/* ---------- random helpers ---------- */
function rngFrom(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
let rnd = rngFrom(Date.now() & 0xffffffff);
const gauss = (r = rnd) => Math.sqrt(-2 * Math.log(1 - r())) * Math.sin(2 * Math.PI * r());
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
const pick = a => a[Math.floor(rnd() * a.length)];

/* ---------- musicians ---------- */
const NAMES = {
  f: ["Clara", "Sofia", "Hana", "Elena", "Amira", "Ingrid", "Lucía", "Mei", "Anya", "Chiara", "Nadia", "Yuki", "Beatriz", "Freya", "Leila", "Marta"],
  m: ["Tomás", "Felix", "Kenji", "Mateo", "Jonas", "Arjun", "Luca", "Pavel", "Samuel", "Oskar", "Rafael", "Daniel", "Henrik", "Omar", "Viktor", "André"],
  last: ["Moreau", "Lindqvist", "Takahashi", "Rossi", "Novak", "Fernandes", "Weber", "Kowalski", "Haddad", "Okafor", "Petrov", "Silva", "Brennan", "Castellano", "Jansen", "Mendes", "Ito", "Kaya", "Dubois", "Nieminen"],
  country: ["France", "Sweden", "Japan", "Italy", "Czechia", "Brazil", "Germany", "Poland", "Lebanon", "Nigeria", "Bulgaria", "Portugal", "Ireland", "Spain", "Netherlands", "Finland", "Turkey", "Korea", "Austria", "Canada"],
};
const overall = m => { let s = 0, w = 0; SKILLS.forEach((k, i) => { s += m.skills[i] * k[3]; w += k[3]; }); return s / w; };
function createMusician(inst, mean, strength, second) {
  const female = rnd() < 0.5;
  const m = { id: Math.random().toString(36).slice(2, 10), female, first: pick(female ? NAMES.f : NAMES.m), last: pick(NAMES.last), country: pick(NAMES.country),
    inst, skills: new Array(11).fill(0), talent: 0.8 + rnd() * 0.5, energy: 2000, focus: -1, sessions: 0, concerts: 0, seed: Math.floor(rnd() * 1e9) };
  strength ??= Math.floor(rnd() * 11); second ??= Math.floor(rnd() * 11);
  let weak = Math.floor(rnd() * 11); if (weak === strength) weak = (weak + 3) % 11;
  for (let i = 0; i < 11; i++) { let v = mean + gauss() * 4.5; if (i === strength) v += 9; if (i === second) v += 5; if (i === weak) v -= 8; m.skills[i] = clamp(v, 0, 100); }
  const c = mean - overall(m); for (let i = 0; i < 11; i++) m.skills[i] = clamp(m.skills[i] + c, 0, 100);
  m.age = 19 + Math.floor(mean / 3) + Math.floor(rnd() * 12);
  m.years = Math.max(2, Math.floor(mean / 4.5) + Math.floor(rnd() * 6) - 2);
  return m;
}
const fullName = m => m.first + " " + m.last;

/* ---------- training & recruitment (same formulas as Unity) ---------- */
const T = { base: 1.4, sec: 0.35, ePractice: 20, eRehearse: 15, eConcert: 25, maxE: 2000, recover: 1200, minE: 10, directorSessions: 2 };
const headroom = v => Math.max(0.01, Math.pow(Math.max(0, 1 - v / 100), 1.1));
const energyFactor = e => e < 25 ? 0.45 : 0.65 + 0.35 * e / T.maxE;
function gain(m, i, f, log) { const b = m.skills[i]; m.skills[i] = clamp(b + f * headroom(b), 0, 100); log.push([m.id, i, b, m.skills[i]]); }
function practice(m, focus, quality = 1) {
  if (m.energy < T.minE) return { ok: false, msg: m.first + " is too tired to practise. Advance to the next day." };
  const log = [], f = T.base * m.talent * energyFactor(m.energy) * quality * (0.85 + rnd() * 0.3);
  gain(m, focus, f, log); for (const r of SKILLS[focus][4]) gain(m, r, f * T.sec, log);
  m.energy = Math.max(0, m.energy - T.ePractice); m.sessions++;
  return { ok: true, msg: m.first + " practised " + SKILLS[focus][0] + ".", log };
}
function rehearse(players, prog) {
  const act = players.filter(p => p.energy >= T.minE);
  if (!act.length) return { ok: false, msg: "Everyone is too tired to rehearse. Advance to the next day." };
  const log = []; let tal = 0;
  for (const m of act) { const f = T.base * m.talent * energyFactor(m.energy) * (0.85 + rnd() * 0.3);

});

// Side panels sit exactly between the top and bottom bars, whatever height the bars wrap to (phones).
